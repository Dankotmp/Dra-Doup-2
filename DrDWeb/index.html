<!DOCTYPE html>
<html lang="cs">
<head>

<meta name="description" content="Virtuální stůl pro Dračí doupě — PJ vytvoří svět a mapu, hráči se připojí kódem přímo k jeho prohlížeči. Bez účtu, bez instalace.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8F211C">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- iOS: umožní přidat appku na plochu a spouštět bez rámečku Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/styl.css">

<script src="js/util.js"></script>
<script src="js/modely.js"></script>

<script src="js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker se nepodařilo zaregistrovat:", e));
    });
  }
</script>
